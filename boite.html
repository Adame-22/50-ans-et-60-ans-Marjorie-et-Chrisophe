<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Boîte noire · Vol MC 5060</title>
  <meta name="theme-color" content="#000033" />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/live.css" />
</head>
<body class="live">
  <header class="live__top">
    <a href="/" class="nav__brand"><span class="nav__mono">M<span>&amp;</span>C</span></a>
    <span class="live__tag">Enregistreur de vol</span>
  </header>
  <main class="live__main">
    <h1 class="live__title">La Boîte noire</h1>
    <p class="live__sub">Un mot, un souvenir, une photo pour Marjorie &amp; Christophe. Tout est enregistré&nbsp;!</p>

    <form class="live-card" id="bn-form" novalidate>
      <div class="field">
        <label for="bn-name">Votre prénom</label>
        <input id="bn-name" name="name" maxlength="60" autocomplete="given-name" />
      </div>
      <div class="field">
        <label for="bn-msg">Votre message</label>
        <textarea id="bn-msg" name="message" rows="4" maxlength="1000" placeholder="Joyeux anniversaire…"></textarea>
      </div>
      <div class="field">
        <span class="field__label">Une photo (facultatif)</span>
        <div class="photo-pick">
          <input id="bn-photo" type="file" accept="image/*" />
          <label for="bn-photo" class="photo-btn" id="bn-photo-label">📷 Ajouter une photo</label>
          <img id="bn-preview" alt="Aperçu de la photo" hidden />
        </div>
      </div>
      <div class="hp" aria-hidden="true"><input name="website" tabindex="-1" autocomplete="off" /></div>
      <p class="form-error" role="alert" hidden></p>
      <button class="btn btn--gold btn--block" type="submit">Enregistrer</button>
    </form>

    <div class="wall" id="bn-wall" aria-live="polite"></div>
  </main>
  <script src="js/boite.js"></script>
</body>
</html>
