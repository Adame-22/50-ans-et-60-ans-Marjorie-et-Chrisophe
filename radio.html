<body class="live">
  <header class="live__top">
    <a href="/" class="nav__brand"><span class="nav__mono">M<span>&amp;</span>C</span></a>
    <span class="live__tag">Fréquence MC 50.60</span>
  </header>
  <main class="live__main">
    <h1 class="live__title">Radio de bord</h1>
    <p class="live__sub">Proposez une chanson ou votez pour celles des autres passagers. Le DJ s'occupe du reste.</p>

    <div class="onair" aria-hidden="true">
      <div class="onair__freq"><small>Sur les ondes</small><b>50.60</b><span>MC FM</span></div>
      <div class="eq"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
    </div>

    <section class="live-card spotify" id="spotify" hidden>
      <p class="live__tag">La playlist de la soirée</p>
      <div class="spotify__frame"></div>
      <a class="btn btn--gold btn--block" id="spotify-open" target="_blank" rel="noopener">Ouvrir dans Spotify</a>
    </section>

    <form class="live-card" id="r-form" novalidate>
      <div class="field"><label for="r-title">Titre</label><input id="r-title" maxlength="100" placeholder="Ex. Les Champs-Élysées" /></div>
      <div class="field"><label for="r-artist">Artiste</label><input id="r-artist" maxlength="80" placeholder="Ex. Joe Dassin" /></div>
      <div class="hp" aria-hidden="true"><input name="website" tabindex="-1" autocomplete="off" /></div>
      <p class="form-error" role="alert" hidden></p>
      <button class="btn btn--gold btn--block" type="submit">Proposer</button>
    </form>

    <h2 class="wall__title">Le hit-parade des passagers</h2>
    <ol class="songs" id="r-list" aria-live="polite"></ol>
  </main>
  <p class="live__legal"><a href="/mentions-legales">Mentions légales &amp; confidentialité</a></p>
